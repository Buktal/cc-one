[package]
name = "cc-one"
version = "1.8.0"
description = "cc one — local LLM usage dashboard with optional GitHub-repo multi-device sync."
authors = ["cc one"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "specta", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Native file open / save dialogs (Library export + "Add files").
tauri-plugin-dialog = "2"
# Auto-update: Ed25519-signed installs fetched from GitHub Releases.
tauri-plugin-updater = "2"
# Relaunch the app after an auto-update install.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-specta v2: pin exact RC — specta v2 not yet stable.
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"

# Local store: rusqlite with bundled SQLite so no system SQLite needed.
rusqlite = { version = "0.31", features = ["bundled"] }
# Cost precision (Decimal stored as TEXT).
rust_decimal = { version = "1", features = ["serde"] }
# Timestamps as ISO8601 UTC.
chrono = { version = "0.4", features = ["serde"] }
# Device identity + record ids.
rand = "0.8"
# ~/.config/cc-one home-relative paths.
dirs = "5"
# Session-log discovery: walk ~/.claude/projects/**/*.jsonl.
walkdir = "2"
# LiteLLM upstream pricing fetch. ureq = blocking + rustls (pure Rust).
ureq = "2"
# Codex config.toml 受控合并（写盘）：编辑型 TOML 解析器，保留未改动部分的
# 注释与格式；只读型 `toml` 重写会丢注释，故不用。
toml_edit = "0.22"
# OpenCode opencode.json 读写（live_opencode）：读用 json5 容忍用户手写的
# 注释/尾逗号；写用 serde_json pretty（字母序）。JSON5 round-trip 会重排键序、
# 丢注释，是固有限制（grok 的 toml_edit 能逐字节保留，OpenCode 不能）。
json5 = "0.4"
# GitHub-repo sync over libgit2. HTTPS-only (PAT); no SSH feature to
# keep the dependency surface small. Windows TLS uses Schannel via libgit2.
git2 = { version = "0.19", default-features = false, features = ["https"] }

# Win32 window geometry for the lightweight glance dock: one atomic
# SetWindowPos that sets the OUTER rect (shadow included) so the window can't
# straddle two monitors of different DPI. Windows-only; reuses the `windows`
# crate tauri/tao already resolve (0.61.x), no new version introduced.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# Windows system-proxy discovery: read HKCU's `Internet Settings` to
# follow the OS proxy on every libgit2 push/fetch. libgit2's own HTTP stack
# (Schannel TLS) ignores the Windows system proxy, so without this a Synced-mode
# client behind a system proxy (Clash/Mihomo, corporate gateway) silently times
# out even though the user's browser works. Light, single-purpose crate.
winreg = "0.52"

[dev-dependencies]
# Test-only temp dirs for db / config / ingest / source_parser tests (S1).
tempfile = "3"
